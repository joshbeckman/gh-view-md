name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  review-comment-metadata:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby --disable-gems test/review_comment_metadata_test.rb
